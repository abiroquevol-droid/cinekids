<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="manifest.json">
<title>CineKids</title>
<style>
:root{--bg:#07111f;--panel:#0c182a;--card:#101e33;--line:#20314b;--text:#fff;--muted:#9db0c9;--accent:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#091524);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input{font:inherit}.app{max-width:1180px;margin:auto;padding:18px 18px 110px}
header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:29px;font-weight:900}.brand span{color:var(--accent)}
.profile{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#0ea5e9);font-weight:900}
.hero{margin:20px 0 18px;padding:26px;border-radius:26px;background:radial-gradient(circle at 80% 15%,rgba(167,139,250,.30),transparent 28%),linear-gradient(135deg,#10213a,#231442);border:1px solid rgba(255,255,255,.07)}
.hero h1{font-size:clamp(2rem,7vw,4rem);line-height:1;margin:8px 0 12px}.muted{color:var(--muted);line-height:1.5}
.actions,.driveChooser{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#111827}.secondary{background:#17263d;color:#fff;border:1px solid var(--line)}
.notice{display:none;margin-top:14px;padding:13px 14px;border-radius:14px;background:#0c2139;color:#cbe9ff;white-space:pre-line}
.breadcrumb{display:none;align-items:center;gap:10px;margin:16px 0;padding:12px;border-radius:14px;background:#0c182a;border:1px solid var(--line)}
.breadcrumb button{border:0;background:#17263d;color:white;border-radius:10px;padding:9px 13px;font-weight:800}.breadcrumb span{color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%;padding:14px 16px;background:#091426;color:#fff;border:1px solid var(--line);border-radius:14px;font-size:16px}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button{white-space:nowrap;background:#122038;color:#b9c8da;border:1px solid var(--line);padding:10px 13px;border-radius:999px}.tabs button.active{background:#fff;color:#111827}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h2{margin:0;font-size:20px}.section-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(min-width:1050px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;position:relative}.poster{aspect-ratio:2/3;display:grid;place-items:center;padding:12px;text-align:center;font-weight:850;background:linear-gradient(145deg,#273c55,#121c2d);overflow:hidden;position:relative}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.posterShade{position:absolute;inset:auto 0 0 0;padding:28px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.82));z-index:1;text-align:left}
.folderPoster{background:linear-gradient(145deg,#243a5e,#151f35)}.folderIcon,.movieIcon{display:block;font-size:52px;margin-bottom:10px}.meta{padding:11px}.title{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{font-size:12px;color:var(--muted);margin-top:4px}.heart{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:white;font-size:18px;z-index:3}
.loadMore{grid-column:1/-1;display:flex;justify-content:center;padding:14px}
nav{position:fixed;left:12px;right:12px;bottom:10px;max-width:760px;margin:auto;background:rgba(8,18,32,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);z-index:50}nav button{background:none;border:0;color:#aab7c9;padding:8px 2px;font-size:12px}nav button.active{color:white}
dialog{width:min(95vw,960px);border:0;border-radius:22px;padding:0;background:#07111f;color:white;overflow:hidden}dialog::backdrop{background:rgba(0,0,0,.82)}#drivePlayer{width:100%;height:min(66vh,600px);border:0;background:#000;display:block}.dlg{padding:16px}.empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}
.detailHero{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}.detailPoster{width:110px;aspect-ratio:2/3;border-radius:12px;object-fit:cover;background:#17263d}.detailTitle{margin:0 0 6px;font-size:22px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:12px;background:#17263d;border:1px solid var(--line);padding:5px 8px;border-radius:999px;color:#d8e3f3}.overview{margin-top:12px;color:#d6e1ef;line-height:1.5}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
</head>
<body>
<div class="app">
<header><div class="brand">Cine<span>Kids</span></div><div class="profile">CK</div></header>
<section class="hero">
<div class="muted">Tu cine familiar</div>
<h1>Películas desde tu Google Drive</h1>
<div class="muted">Explora unidades compartidas, carpetas y películas. CineKids carga el catálogo de forma progresiva para mantenerse rápido.</div>
<div class="actions">
<button class="btn primary" id="loginBtn" onclick="googleLogin()">Continuar con Google</button>
<button class="btn secondary" onclick="installApp()">Instalar CineKids</button>
<button class="btn secondary" onclick="logout()">Cerrar sesión</button>
</div>
<div id="notice" class="notice"></div>
<div id="driveChooser" class="driveChooser"></div>
</section>
<div id="breadcrumb" class="breadcrumb"><button onclick="goBack()">← Atrás</button><span id="pathName"></span></div>
<input id="search" class="search" placeholder="Buscar carpeta o película…" oninput="resetRender()">
<div class="tabs">
<button class="active" onclick="setFilter('Todos',this)">Todos</button>
<button onclick="setFilter('Animación',this)">Animación</button>
<button onclick="setFilter('Familiar',this)">Familiar</button>
<button onclick="showFavorites(this)">Favoritos</button>
</div>
<div class="section-head"><h2 id="sectionTitle">Catálogo</h2><span id="count"></span></div>
<div id="grid" class="grid"></div>
</div>
<nav>
<button class="active" onclick="home()">⌂<br>Inicio</button>
<button onclick="setFilter('Animación',this)">🧸<br>Animación</button>
<button onclick="showFavorites(this)">♡<br>Favoritos</button>
<button onclick="settings()">⚙<br>Ajustes</button>
</nav>
<dialog id="player">
<iframe id="drivePlayer" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div class="dlg">
<div class="detailHero">
<img id="detailPoster" class="detailPoster" alt="">
<div>
<h2 id="ptitle" class="detailTitle"></h2>
<div id="pmeta" class="muted"></div>
<div id="detailChips" class="chips"></div>
</div>
</div>
<div id="overview" class="overview"></div>
<div class="actions"><button class="btn secondary" onclick="closePlayer()">Cerrar</button></div>
</div>
</dialog>
<script>
let tokenClient,accessToken=null,items=[],movies=[],filter='Todos',onlyFav=false,deferredPrompt=null,currentDrive=null,navigation=[],renderLimit=60;
const fav=new Set(JSON.parse(localStorage.getItem('ck_fav')||'[]'));
const metaCache=new Map(JSON.parse(localStorage.getItem('ck_meta_cache')||'[]'));
const notice=document.getElementById('notice'),grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),sectionTitle=document.getElementById('sectionTitle'),breadcrumb=document.getElementById('breadcrumb'),pathName=document.getElementById('pathName');
function msg(t){notice.style.display='block';notice.textContent=t}
function saveMetaCache(){try{localStorage.setItem('ck_meta_cache',JSON.stringify([...metaCache.entries()].slice(-500)))}catch{}}
function initGoogle(){if(!window.google?.accounts?.oauth2){setTimeout(initGoogle,400);return}const id=window.CINEKIDS?.GOOGLE_CLIENT_ID||'';if(!id||id.includes('PON_AQUI'))return;tokenClient=google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.readonly',callback:async r=>{if(r.error){msg('Error de autenticación: '+r.error);return}accessToken=r.access_token;document.getElementById('loginBtn').textContent='Google conectado';msg('Cuenta conectada. Buscando unidades compartidas…');await loadSharedDrives();}})}
addEventListener('load',()=>setTimeout(initGoogle,600));
function googleLogin(){const id=window.CINEKIDS?.GOOGLE_CLIENT_ID||'';if(!id||id.includes('PON_AQUI')){msg('Falta conectar Google OAuth. Revisa config.js.');return}if(!tokenClient)initGoogle();if(tokenClient)tokenClient.requestAccessToken({prompt:'consent'});else msg('Google todavía está cargando. Intenta nuevamente.')}
async function api(path){const response=await fetch('https://www.googleapis.com/drive/v3/'+path,{headers:{Authorization:'Bearer '+accessToken}});if(!response.ok)throw new Error(await response.text());return response.json()}
async function loadSharedDrives(){if(!accessToken)return;try{const allDrives=[];let pageToken='';do{let path='drives?pageSize=100';if(pageToken)path+='&pageToken='+encodeURIComponent(pageToken);const data=await api(path);allDrives.push(...(data.drives||[]));pageToken=data.nextPageToken||''}while(pageToken);const chooser=document.getElementById('driveChooser');chooser.innerHTML='';allDrives.forEach(d=>{const button=document.createElement('button');button.className='btn secondary';button.textContent=d.name;button.onclick=()=>openDrive(d);chooser.appendChild(button)});msg(`Encontradas ${allDrives.length} unidades compartidas. Elige una para explorarla.`)}catch(e){msg('No se pudieron leer las unidades compartidas: '+e.message)}}
async function openDrive(drive){currentDrive=drive;navigation=[{id:drive.id,name:drive.name,root:true}];document.getElementById('driveChooser').innerHTML='';breadcrumb.style.display='flex';await loadFolder(drive.id,drive.name,true)}
async function loadFolder(folderId,folderName,isRoot=false){if(!currentDrive)return;msg('Abriendo '+folderName+'…');pathName.textContent=navigation.map(x=>x.name).join(' › ');sectionTitle.textContent=folderName;try{const result=[];let pageToken='';do{const query=`'${folderId}' in parents and trashed = false`;const q=encodeURIComponent(query);const fields=encodeURIComponent('nextPageToken,files(id,name,mimeType,size,modifiedTime,parents,thumbnailLink,webViewLink,description)');let path=`files?corpora=drive&driveId=${encodeURIComponent(currentDrive.id)}&includeItemsFromAllDrives=true&supportsAllDrives=true&pageSize=1000&q=${q}&fields=${fields}&orderBy=folder,name`;if(pageToken)path+='&pageToken='+encodeURIComponent(pageToken);const data=await api(path);result.push(...(data.files||[]));pageToken=data.nextPageToken||''}while(pageToken);items=result;movies=result.filter(f=>looksLikeMovie(f.name,f.mimeType)).map(f=>({...f,cat:detectCategory(f.name)}));renderLimit=60;render();const folders=result.filter(isFolder).length;msg(`${folderName}: ${folders} carpetas · ${movies.length} películas.`)}catch(e){msg('Error al abrir la carpeta: '+e.message)}}
function isFolder(f){return f.mimeType==='application/vnd.google-apps.folder'}
async function openFolder(id,encodedName){const name=decodeURIComponent(encodedName);navigation.push({id,name,root:false});await loadFolder(id,name,false)}
async function goBack(){if(navigation.length<=1){navigation=[];currentDrive=null;items=[];movies=[];breadcrumb.style.display='none';pathName.textContent='';sectionTitle.textContent='Catálogo';renderLimit=60;render();await loadSharedDrives();return}navigation.pop();const previous=navigation[navigation.length-1];await loadFolder(previous.id,previous.name,previous.root)}
function looksLikeMovie(name,mime){if(mime==='application/vnd.google-apps.folder')return false;return (mime||'').startsWith('video/')||/\.(mp4|mkv|avi|mov|m4v|webm|mpeg|mpg)$/i.test(name||'')}
function cleanTitle(name){return String(name||'').replace(/\.(mp4|mkv|avi|mov|m4v|webm|mpeg|mpg)$/i,'').replace(/\[[^\]]+\]/g,' ').replace(/\((?:1080p|720p|2160p|4k|bluray|web[- ]?dl|webrip|hdrip|dvdrip)[^)]*\)/ig,' ').replace(/(1080p|720p|2160p|4k|bluray|web[- ]?dl|webrip|hdrip|dvdrip|x264|x265|h264|h265|hevc|aac|latino|dual|castellano)/ig,' ').replace(/[._]+/g,' ').replace(/\s+/g,' ').trim()}
function detectYear(name){const m=String(name||'').match(/(19\d{2}|20\d{2})/);return m?m[1]:''}
function detectCategory(name){const n=String(name||'').toLowerCase();if(n.includes('animacion')||n.includes('animación')||n.includes('cartoon')||n.includes('disney')||n.includes('pixar'))return 'Animación';return 'Familiar'}
async function getMovieMetadata(movie){if(metaCache.has(movie.id))return metaCache.get(movie.id);const key=window.CINEKIDS?.TMDB_API_KEY||'';if(!key)return basicMetadata(movie);const query=cleanTitle(movie.name).replace(/(19\d{2}|20\d{2})/g,'').trim();const year=detectYear(movie.name);try{const params=new URLSearchParams({api_key:key,language:'es-MX',query:query,include_adult:'false'});if(year)params.set('year',year);const r=await fetch('https://api.themoviedb.org/3/search/movie?'+params.toString());if(!r.ok)throw new Error('TMDB '+r.status);const data=await r.json();const hit=(data.results||[])[0];if(!hit){const meta=basicMetadata(movie);metaCache.set(movie.id,meta);saveMetaCache();return meta}const meta={title:hit.title||cleanTitle(movie.name),originalTitle:hit.original_title||'',overview:hit.overview||movie.description||'Sin descripción disponible.',poster:hit.poster_path?'https://image.tmdb.org/t/p/w500'+hit.poster_path:'',year:(hit.release_date||'').slice(0,4)||year,rating:hit.vote_average?Number(hit.vote_average).toFixed(1):'',language:hit.original_language||''};metaCache.set(movie.id,meta);saveMetaCache();return meta}catch{return basicMetadata(movie)}}
function basicMetadata(movie){return{title:cleanTitle(movie.name),originalTitle:'',overview:movie.description||'Sin descripción disponible.',poster:movie.thumbnailLink||'',year:detectYear(movie.name),rating:'',language:''}}
function resetRender(){renderLimit=60;render()}
function render(){const q=search.value.toLowerCase().trim();let folders=items.filter(isFolder).filter(f=>String(f.name||'').toLowerCase().includes(q));let movieList=movies.filter(m=>(filter==='Todos'||m.cat===filter)&&(!onlyFav||fav.has(m.id))&&cleanTitle(m.name).toLowerCase().includes(q));if(onlyFav)folders=[];count.textContent=`${folders.length} carpetas · ${movieList.length} películas`;const visibleMovies=movieList.slice(0,renderLimit);let html='';html+=folders.map(f=>{const encodedName=encodeURIComponent(f.name);return `<article class="card" onclick="openFolder('${f.id}','${encodedName}')"><div class="poster folderPoster"><div><span class="folderIcon">📁</span>${escapeHtml(f.name)}</div></div><div class="meta"><div class="title">${escapeHtml(f.name)}</div><div class="small">Carpeta</div></div></article>`}).join('');html+=visibleMovies.map(m=>{const cached=metaCache.get(m.id);const poster=cached?.poster||'';const shownTitle=cached?.title||cleanTitle(m.name);const year=cached?.year||detectYear(m.name);return `<article class="card" onclick="openMovie('${m.id}')"><button class="heart" onclick="event.stopPropagation();toggleFav('${m.id}')">${fav.has(m.id)?'♥':'♡'}</button><div class="poster">${poster?`<img loading="lazy" src="${escapeHtml(poster)}" alt="">`:''}${poster?'':`<div><span class="movieIcon">🎬</span>${escapeHtml(shownTitle)}</div>`}${poster?`<div class="posterShade">${escapeHtml(shownTitle)}</div>`:''}</div><div class="meta"><div class="title">${escapeHtml(shownTitle)}</div><div class="small">${year?escapeHtml(year)+' · ':''}${escapeHtml(m.mimeType||'video')}</div></div></article>`}).join('');if(movieList.length>renderLimit)html+=`<div class="loadMore"><button class="btn secondary" onclick="loadMore()">Cargar más (${movieList.length-renderLimit})</button></div>`;if(!html)html=`<div class="empty">${accessToken?'Esta carpeta está vacía o no contiene videos compatibles.':'Conecta Google para cargar tu catálogo.'}</div>`;grid.innerHTML=html}
function loadMore(){renderLimit+=60;render()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('ck_fav',JSON.stringify([...fav]));render()}
function setFilter(value,button){filter=value;onlyFav=false;renderLimit=60;sectionTitle.textContent=value==='Todos'?(navigation.length?navigation[navigation.length-1].name:'Catálogo'):value;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(button&&button.closest?.('.tabs'))button.classList.add('active');render()}
function showFavorites(){onlyFav=true;filter='Todos';renderLimit=60;sectionTitle.textContent='Favoritos';render()}
async function home(){filter='Todos';onlyFav=false;navigation=[];currentDrive=null;items=[];movies=[];renderLimit=60;breadcrumb.style.display='none';sectionTitle.textContent='Catálogo';render();if(accessToken)await loadSharedDrives();scrollTo({top:0,behavior:'smooth'})}
function settings(){const tmdb=window.CINEKIDS?.TMDB_API_KEY?'Sí':'No';msg('Ajustes\nGoogle Client ID configurado: '+(window.CINEKIDS?.GOOGLE_CLIENT_ID&&!window.CINEKIDS.GOOGLE_CLIENT_ID.includes('PON_AQUI')?'Sí':'No')+'\nPortadas y fichas TMDB: '+tmdb)}
async function openMovie(id){const movie=movies.find(x=>x.id===id);if(!movie)return;const player=document.getElementById('player'),drivePlayer=document.getElementById('drivePlayer'),ptitle=document.getElementById('ptitle'),pmeta=document.getElementById('pmeta'),detailPoster=document.getElementById('detailPoster'),detailChips=document.getElementById('detailChips'),overview=document.getElementById('overview');const meta=await getMovieMetadata(movie);ptitle.textContent=meta.title||cleanTitle(movie.name);pmeta.textContent=movie.mimeType||'video';detailPoster.src=meta.poster||'';detailPoster.style.display=meta.poster?'block':'none';const chips=[];if(meta.year)chips.push(meta.year);if(meta.rating)chips.push('★ '+meta.rating);if(meta.language)chips.push('Idioma original: '+meta.language.toUpperCase());detailChips.innerHTML=chips.map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join('');overview.textContent=meta.overview||'Sin descripción disponible.';drivePlayer.src='https://drive.google.com/file/d/'+encodeURIComponent(movie.id)+'/preview';player.showModal();metaCache.set(movie.id,meta);saveMetaCache();render();msg('Película abierta desde Google Drive.')}
function closePlayer(){document.getElementById('drivePlayer').src='about:blank';document.getElementById('player').close()}
function logout(){accessToken=null;items=[];movies=[];navigation=[];currentDrive=null;renderLimit=60;document.getElementById('driveChooser').innerHTML='';document.getElementById('loginBtn').textContent='Continuar con Google';breadcrumb.style.display='none';sectionTitle.textContent='Catálogo';render();msg('Sesión cerrada.')}
addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event});
async function installApp(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else msg('En Chrome abre el menú ⋮ y elige “Instalar aplicación” o “Añadir a pantalla de inicio”.')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
