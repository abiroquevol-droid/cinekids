<script>
let currentMovieId=null;
let currentMovie=null;
let nativeObjectUrl=null;

const AUDIO_PREF_KEY='ck_prefer_latino';
let preferLatino=localStorage.getItem(AUDIO_PREF_KEY)!=='0';

let tokenClient;
let accessToken=null;
let items=[];
let movies=[];
let filter='Todos';
let onlyFav=false;
let deferredPrompt=null;
let currentDrive=null;
let navigation=[];
let renderLimit=60;

let enrichRunning=false;
let enrichGeneration=0;
let authBusy=false;

const fav=new Set(JSON.parse(localStorage.getItem('ck_fav')||'[]'));
const metaCache=new Map(JSON.parse(localStorage.getItem('ck_meta_cache')||'[]'));

const notice=document.getElementById('notice');
const grid=document.getElementById('grid');
const count=document.getElementById('count');
const search=document.getElementById('search');
const sectionTitle=document.getElementById('sectionTitle');
const breadcrumb=document.getElementById('breadcrumb');
const pathName=document.getElementById('pathName');

function msg(t){
notice.style.display='block';
notice.textContent=t;
}

function saveMetaCache(){
try{
localStorage.setItem(
'ck_meta_cache',
JSON.stringify([...metaCache.entries()].slice(-500))
);
}catch{}
}

function initGoogle(){

if(!window.google?.accounts?.oauth2){
setTimeout(initGoogle,400);
return;
}

const id=window.CINEKIDS?.GOOGLE_CLIENT_ID||'';

if(!id||id.includes('PON_AQUI')){
return;
}

tokenClient=google.accounts.oauth2.initTokenClient({
client_id:id,
scope:'https://www.googleapis.com/auth/drive.readonly',

callback:async r=>{

if(r.error){
msg('Error de autenticación: '+r.error);
return;
}

accessToken=r.access_token;

document.getElementById('loginBtn').textContent='Google conectado';

msg('Cuenta conectada. Buscando unidades compartidas…');

await loadSharedDrives();

}
});

}

addEventListener('load',()=>{
updateAudioPrefButton();
setTimeout(initGoogle,600);
});

function googleLogin(){

const id=window.CINEKIDS?.GOOGLE_CLIENT_ID||'';

if(!id||id.includes('PON_AQUI')){
msg('Falta conectar Google OAuth. Revisa config.js.');
return;
}

if(!tokenClient){
initGoogle();
}

if(tokenClient){
tokenClient.requestAccessToken({
prompt:'consent'
});
}else{
msg('Google todavía está cargando. Intenta nuevamente en unos segundos.');
}

}
async function api(path){
 const r=await fetch(
   'https://www.googleapis.com/drive/v3/'+path,
   {headers:{Authorization:'Bearer '+accessToken}}
 );

 if(r.status===401){
   accessToken=null;
   document.getElementById('loginBtn').textContent='Continuar con Google';
   throw new Error('La sesión de Google expiró. Pulsa Continuar con Google.');
 }

 if(!r.ok){
   throw new Error(await r.text());
 }

 return r.json();
}

/* =========================================================
   UNIDADES COMPARTIDAS
========================================================= */

async function loadSharedDrives(){

 if(!accessToken)return;

 try{

   const data=await api('drives?pageSize=100');

   const chooser=document.getElementById('driveChooser');

   chooser.innerHTML='';

   const drives=data.drives||[];

   drives.forEach(d=>{

     const b=document.createElement('button');

     b.className='btn secondary';

     b.textContent=d.name;

     b.onclick=()=>openDrive(d);

     chooser.appendChild(b);

   });

   msg(
     `Encontradas ${drives.length} unidades compartidas. `+
     `Elige una para explorar sus carpetas y películas.`
   );

 }catch(e){

   msg('No se pudieron leer las unidades compartidas: '+e.message);

 }

}


/* =========================================================
   ABRIR UNIDAD
========================================================= */

async function openDrive(drive){

 currentDrive=drive;

 navigation=[];

 navigation.push({
   id:drive.id,
   name:drive.name,
   root:true
 });

 pathName.textContent=drive.name;

 breadcrumb.style.display='flex';

 sectionTitle.textContent=drive.name;

 search.value='';

 onlyFav=false;

 await loadFolder(drive.id,drive.name,true);

}


/* =========================================================
   LEER CONTENIDO DE CARPETA
========================================================= */

async function loadFolder(folderId,folderName,isDriveRoot=false){

 if(!accessToken||!currentDrive)return;

 const generation=++enrichGeneration;

 renderLimit=60;

 items=[];

 movies=[];

 sectionTitle.textContent=folderName;

 pathName.textContent=navigation.map(x=>x.name).join('  ›  ');

 grid.innerHTML=
   '<div class="empty">Cargando carpeta…</div>';

 count.textContent='';

 msg('Leyendo '+folderName+'…');

 try{

   let pageToken='';

   do{

     let q;

     if(isDriveRoot){
       q="'"+currentDrive.id+"' in parents and trashed = false";
     }else{
       q="'"+folderId+"' in parents and trashed = false";
     }

     const fields=
       'nextPageToken,files('+
       'id,'+
       'name,'+
       'mimeType,'+
       'size,'+
       'modifiedTime,'+
       'parents,'+
       'shortcutDetails(targetId,targetMimeType)'+
       ')';

     let path=
       'files?'+
       'corpora=drive'+
       '&driveId='+encodeURIComponent(currentDrive.id)+
       '&includeItemsFromAllDrives=true'+
       '&supportsAllDrives=true'+
       '&pageSize=1000'+
       '&q='+encodeURIComponent(q)+
       '&fields='+encodeURIComponent(fields);

     if(pageToken){
       path+='&pageToken='+encodeURIComponent(pageToken);
     }

     const data=await api(path);

     for(const f of(data.files||[])){

       const resolved=resolveDriveItem(f);

       if(resolved){
         items.push(resolved);
       }

     }

     pageToken=data.nextPageToken||'';

   }while(pageToken);

   sortItems();

   movies=items.filter(x=>x.kind==='movie');

   resetRender();

   const folders=items.filter(x=>x.kind==='folder').length;

   msg(
     `${folderName}: ${folders} carpetas · `+
     `${movies.length} películas`
   );

   if(generation===enrichGeneration){
     startMetadataEnrichment(generation);
   }

 }catch(e){

   grid.innerHTML=
     '<div class="empty">No se pudo abrir esta carpeta.</div>';

   msg('Error al leer la carpeta: '+e.message);

 }

}


/* =========================================================
   RESOLVER CARPETAS, VIDEOS Y ACCESOS DIRECTOS
========================================================= */

function resolveDriveItem(f){

 const folderMime='application/vnd.google-apps.folder';

 const shortcutMime='application/vnd.google-apps.shortcut';

 /*
   CARPETA NORMAL
 */

 if(f.mimeType===folderMime){

   return{
     ...f,
     realId:f.id,
     realMime:f.mimeType,
     kind:'folder',
     isShortcut:false
   };

 }

 /*
   ACCESO DIRECTO
 */

 if(f.mimeType===shortcutMime){

   const targetId=f.shortcutDetails?.targetId;

   const targetMime=f.shortcutDetails?.targetMimeType;

   if(!targetId)return null;

   /*
     ACCESO DIRECTO A CARPETA
   */

   if(targetMime===folderMime){

     return{
       ...f,
       realId:targetId,
       realMime:targetMime,
       kind:'folder',
       isShortcut:true
     };

   }

   /*
     ACCESO DIRECTO A VIDEO
   */

   if(
     (targetMime||'').startsWith('video/') ||
     looksLikeMovie(f.name,targetMime)
   ){

     return{
       ...f,
       realId:targetId,
       realMime:targetMime,
       mimeType:targetMime,
       kind:'movie',
       isShortcut:true
     };

   }

   return null;

 }

 /*
   VIDEO NORMAL
 */

 if(looksLikeMovie(f.name,f.mimeType)){

   return{
     ...f,
     realId:f.id,
     realMime:f.mimeType,
     kind:'movie',
     isShortcut:false
   };

 }

 return null;

}


/* =========================================================
   DETECTAR PELÍCULAS
========================================================= */

function looksLikeMovie(name,mime){

 if(mime==='application/vnd.google-apps.folder'){
   return false;
 }

 const videoMime=(mime||'').startsWith('video/');

 const videoExtension=
   /\.(mp4|mkv|avi|mov|m4v|webm|mpeg|mpg|ts|m2ts)$/i.test(name||'');

 return videoMime||videoExtension;

}


/* =========================================================
   ORDENAR
========================================================= */

function sortItems(){

 items.sort((a,b)=>{

   if(a.kind!==b.kind){
     return a.kind==='folder'?-1:1;
   }

   return cleanTitle(a.name)
     .localeCompare(
       cleanTitle(b.name),
       'es',
       {numeric:true,sensitivity:'base'}
     );

 });

}


/* =========================================================
   LIMPIAR TÍTULO
========================================================= */

function cleanTitle(n){

 return String(n||'')
   .replace(/\.(mp4|mkv|avi|mov|m4v|webm|mpeg|mpg|ts|m2ts)$/i,'')
   .replace(/[._]/g,' ')
   .replace(/\s+/g,' ')
   .trim();

}


/* =========================================================
   EXTRAER AÑO
========================================================= */

function extractYear(title){

 const m=String(title||'').match(
   /\b(19\d{2}|20\d{2})\b/
 );

 return m?Number(m[1]):null;

}


/* =========================================================
   NORMALIZAR TÍTULO PARA TMDB
========================================================= */

function normalizeMovieTitle(name){

 let t=cleanTitle(name);

 t=t
   .replace(/\b(2160p|1080p|720p|480p|4k|uhd|hdr|hdr10|bluray|blu-ray|brrip|webrip|web-dl|webdl|dvdrip|x264|x265|h264|h265|hevc|aac|ac3|dts|latino|castellano|español|spanish|english|dual|multi|subs?|subtitulado)\b/gi,' ')
   .replace(/\[[^\]]*]/g,' ')
   .replace(/\{[^}]*}/g,' ')
   .replace(/\s+/g,' ')
   .trim();

 return t;

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(s){

 return String(s).replace(
   /[&<>"']/g,
   c=>({
     '&':'&amp;',
     '<':'&lt;',
     '>':'&gt;',
     '"':'&quot;',
     "'":'&#39;'
   }[c])
 );

}

function renderCard(item){

 /*
   CARPETA
 */

 if(item.kind==='folder'){

   return`
   <article
     class="card"
     onclick="openFolderItem('${item.realId}',${JSON.stringify(title)})">

     <div class="poster folderPoster">

       <div>
         <span class="folderIcon">
         ${item.isShortcut?'🔗📁':'📁'}
         </span>

         ${escapeHtml(title)}
       </div>

     </div>

     <div class="meta">

       <div class="title">
       ${escapeHtml(title)}
       </div>

       <div class="small">
       ${item.isShortcut?'Acceso directo a carpeta':'Carpeta'}
       </div>

     </div>

   </article>
   `;

 }

 /*
   PELÍCULA
 */

 const meta=metaCache.get(item.realId)||{};

 const poster=meta.poster||'';

 const displayTitle=
   meta.titleEs||
   meta.title||
   title;

 const posterHtml=poster
   ?`<img
       src="${escapeHtml(poster)}"
       loading="lazy"

       onerror="this.remove()">`
   :'';

 return`
 <article
   class="card"
   onclick="openMovie('${item.realId}')">

   <button
     class="heart"
     onclick="event.stopPropagation();toggleFav('${item.realId}')">
     ${fav.has(item.realId)?'♥':'♡'}
   </button>

   <div class="poster">

     ${posterHtml}

     ${poster
       ?''
       :`<div>
          <span class="movieIcon">🎬</span>
          ${escapeHtml(displayTitle)}
        </div>`
     }

     ${poster
       ?`<div class="posterShade">
          ${escapeHtml(displayTitle)}
        </div>`
       :''
     }

   </div>

   <div class="meta">

     <div class="title">
       ${escapeHtml(displayTitle)}
     </div>

     <div class="small">
       ${escapeHtml(item.realMime||item.mimeType||'video')}
       ${item.isShortcut?' · acceso directo':''}
     </div>

   </div>

 </article>
 `;

}

/* =========================================================
   TMDB
========================================================= */

function getTmdbKey(){

 return(
   window.CINEKIDS?.TMDB_API_KEY||
   window.CINEKIDS?.TMDB_KEY||
   ''
 );

}


async function tmdbFetch(path){

 const key=getTmdbKey();

 if(!key){
   throw new Error('TMDB API Key no configurada');
 }

 const separator=path.includes('?')?'&':'?';

 const url=
   'https://api.themoviedb.org/3/'+
   path+
   separator+
   'api_key='+encodeURIComponent(key)+
   '&language=es-MX';

 const r=await fetch(url);

 if(!r.ok){
   throw new Error('TMDB HTTP '+r.status);
 }

 return r.json();

}


/* =========================================================
   BUSCAR METADATOS
========================================================= */

async function fetchMovieMetadata(movie){

 const original=cleanTitle(movie.name);

 const normalized=normalizeMovieTitle(movie.name);

 const year=extractYear(original);

 let query=normalized
   .replace(/\b(19\d{2}|20\d{2})\b/g,' ')
   .replace(/\s+/g,' ')
   .trim();

 if(!query){
   query=original;
 }

 let path=
   'search/movie?query='+
   encodeURIComponent(query)+
   '&include_adult=false';

 if(year){
   path+='&year='+year;
 }

 let data=await tmdbFetch(path);

 let results=data.results||[];

 /*
   Si no encuentra usando el año,
   vuelve a intentar sin él.
 */

 if(!results.length&&year){

   data=await tmdbFetch(
     'search/movie?query='+
     encodeURIComponent(query)+
     '&include_adult=false'
   );

   results=data.results||[];

 }

 if(!results.length){
   return null;
 }

 const best=chooseBestMovieMatch(
   query,
   year,
   results
 );

 if(!best){
   return null;
 }

 return{
   tmdbId:best.id,
   title:best.title||best.original_title||original,
   titleEs:best.title||best.original_title||original,
   originalTitle:best.original_title||'',
   overview:best.overview||'',
   releaseDate:best.release_date||'',
   year:best.release_date
     ?best.release_date.slice(0,4)
     :(year||''),
   vote:best.vote_average||0,
   poster:best.poster_path
     ?'https://image.tmdb.org/t/p/w500'+best.poster_path
     :'',
   backdrop:best.backdrop_path
     ?'https://image.tmdb.org/t/p/w1280'+best.backdrop_path
     :''
 };

}


/* =========================================================
   ELEGIR COINCIDENCIA TMDB
========================================================= */

function chooseBestMovieMatch(query,year,results){

 const nq=normalizeForCompare(query);

 let best=null;

 let bestScore=-999;

 for(const r of results.slice(0,10)){

   const title=
     r.title||
     r.original_title||
     '';

   const nt=normalizeForCompare(title);

   let score=0;

   if(nt===nq){
     score+=100;
   }

   if(nt.includes(nq)||nq.includes(nt)){
     score+=35;
   }

   const queryWords=nq.split(' ').filter(Boolean);

   const titleWords=new Set(
     nt.split(' ').filter(Boolean)
   );

   for(const w of queryWords){
     if(titleWords.has(w)){
       score+=6;
     }
   }

   const ry=r.release_date
     ?Number(r.release_date.slice(0,4))
     :null;

   if(year&&ry){

     if(year===ry){
       score+=45;
     }else if(Math.abs(year-ry)===1){
       score+=8;
     }else{
       score-=Math.min(
         30,
         Math.abs(year-ry)*4
       );
     }

   }

   score+=(r.popularity||0)/100;

   if(score>bestScore){

     bestScore=score;

     best=r;

   }

 }

 /*
   Evita usar una portada claramente incorrecta.
 */

 if(bestScore<18){
   return null;
 }

 return best;

}


function normalizeForCompare(s){

 return String(s||'')
   .normalize('NFD')
   .replace(/[\u0300-\u036f]/g,'')
   .toLowerCase()
   .replace(/[^a-z0-9]+/g,' ')
   .replace(/\s+/g,' ')
   .trim();

}


/* =========================================================
   ENRIQUECIMIENTO PROGRESIVO
========================================================= */

async function startMetadataEnrichment(generation){

 if(enrichRunning)return;

 if(!getTmdbKey()){
   return;
 }

 enrichRunning=true;

 try{

   const queue=movies
     .filter(m=>!metaCache.has(m.realId))
     .slice(0,120);

   for(let i=0;i<queue.length;i++){

     if(generation!==enrichGeneration){
       break;
     }

     const movie=queue[i];

     try{

       const meta=await fetchMovieMetadata(movie);

       if(meta){

         metaCache.set(
           movie.realId,
           meta
         );

       }else{

         /*
           Guardamos una marca para no consultar
           la misma película una y otra vez.
         */

         metaCache.set(
           movie.realId,
           {
             titleEs:cleanTitle(movie.name),
             noMatch:true
           }
         );

       }

       if(i%5===0){
         saveMetaCache();
         render();
       }

     }catch(e){

       console.warn(
         'TMDB:',
         movie.name,
         e
       );

     }

     /*
       Pequeña pausa para no saturar la API.
     */

     await new Promise(
       resolve=>setTimeout(resolve,90)
     );

   }

   saveMetaCache();

   if(generation===enrichGeneration){
     render();
   }

 }finally{

   enrichRunning=false;

 }

}

/* =========================================================
   PUNTUAR PISTAS DE AUDIO
========================================================= */

function audioLabelScore(track){

 const label=(
   (track?.label||'')+
   ' '+
   (track?.language||'')
 ).toLowerCase();

 if(
   label.includes('latino')||
   label.includes('latam')||
   label.includes('español latino')||
   label.includes('spanish latin')||
   label.includes('es-419')
 ){
   return 100;
 }

 if(
   label.includes('es-mx')||
   label.includes('mexico')||
   label.includes('méxico')
 ){
   return 95;
 }

 if(
   label.includes('español')||
   label.includes('spanish')
 ){
   return 80;
 }

 if(
   /\b(es|spa)\b/.test(label)
 ){
   return 70;
 }

 return 0;

}


/* =========================================================
   INTENTAR SELECCIONAR LATINO
========================================================= */

function trySelectLatinoTrack(video){

 try{

   const tracks=video.audioTracks;

   if(!tracks||!tracks.length){
     return false;
   }

   let best=null;

   let bestScore=0;

   for(let i=0;i<tracks.length;i++){

     const track=tracks[i];

     const score=audioLabelScore(track);

     if(score>bestScore){

       best=track;

       bestScore=score;

     }

   }

   if(!best||bestScore<=0){
     return false;
   }

   for(let i=0;i<tracks.length;i++){

     tracks[i].enabled=
       tracks[i]===best;

   }

   msg(
     '🎧 Audio seleccionado: '+
     (
       best.label||
       best.language||
       'Español Latino'
     )
   );

   return true;

 }catch(e){

   console.warn(
     'Selección de audio:',
     e
   );

   return false;

 }

}

 document.getElementById('detailChips').innerHTML=

 document.getElementById('pmeta').textContent=

   ?meta.originalTitle

 document.getElementById('overview').textContent=
   meta.overview||
   'Sin descripción disponible.';

 const detailPoster=
   document.getElementById('detailPoster');

 if(meta.poster){

   detailPoster.src=meta.poster;

   detailPoster.style.display='block';

 }else{

   detailPoster.removeAttribute('src');

   detailPoster.style.display='none';

 }

 const native=
   document.getElementById('nativePlayer');

 const drive=
   document.getElementById('drivePlayer');

 /*
   Reiniciar reproductores
 */

 native.pause();

 native.removeAttribute('src');

 native.style.display='none';

 drive.style.display='block';

 /*
   REPRODUCTOR PRINCIPAL DE GOOGLE DRIVE
 */

 drive.src=
   'https://drive.google.com/file/d/'+
   encodeURIComponent(currentMovieId)+
   '/preview';

 document.getElementById('player').showModal();

}


/* =========================================================
   MODO NATIVO EXPERIMENTAL
========================================================= */

async function tryNativeLatino(){

 if(!currentMovie||!currentMovieId){

   msg('Primero abre una película.');

   return;

 }

 if(!accessToken){

   msg(
     'La sesión de Google no está activa. '+
     'Pulsa Continuar con Google.'
   );

   return;

 }

 const native=
   document.getElementById('nativePlayer');

 const drive=
   document.getElementById('drivePlayer');

 msg(
   'Preparando modo de audio Latino…'
 );

 try{

   /*
     Descarga autenticada desde Drive.

     Este modo es experimental porque algunos MKV,
     códecs o películas muy grandes no pueden
     reproducirse directamente en Chrome/Android.
   */

   const url=
     'https://www.googleapis.com/drive/v3/files/'+
     encodeURIComponent(currentMovieId)+
     '?alt=media&supportsAllDrives=true';

   const r=await fetch(
     url,
     {
       headers:{
         Authorization:
           'Bearer '+accessToken
       }
     }
   );

   if(r.status===401){

     accessToken=null;

     document.getElementById(
       'loginBtn'
     ).textContent='Continuar con Google';

     throw new Error(
       'La sesión de Google expiró'
     );

   }

   if(!r.ok){

     throw new Error(
       'HTTP '+r.status
     );

   }

   const blob=await r.blob();

   /*
     Liberar video anterior.
   */

   if(nativeObjectUrl){

     URL.revokeObjectURL(
       nativeObjectUrl
     );

     nativeObjectUrl=null;

   }

   nativeObjectUrl=
     URL.createObjectURL(blob);

   /*
     Cambiar del reproductor Drive
     al reproductor nativo.
   */

   drive.src='about:blank';

   drive.style.display='none';

   native.style.display='block';

   native.src=nativeObjectUrl;

   native.onloadedmetadata=()=>{

     let selected=false;

     if(preferLatino){

       selected=
         trySelectLatinoTrack(native);

     }

     if(!selected){

       msg(
         'El navegador no permite seleccionar '+
         'automáticamente una pista Latino en este archivo. '+
         'Puedes regresar al reproductor de Google Drive.'
       );

     }

     native.play().catch(()=>{});

   };

   native.onerror=()=>{

     msg(
       'Este formato o códec no es compatible '+
       'con el reproductor nativo. '+
       'Usa el reproductor de Google Drive.'
     );

   };

 }catch(e){

   native.pause();

   native.removeAttribute('src');

   native.style.display='none';

   drive.style.display='block';

   drive.src=
     'https://drive.google.com/file/d/'+
     encodeURIComponent(currentMovieId)+
     '/preview';

   msg(
     'No se pudo utilizar el modo Latino: '+
     e.message+
     '. Se mantiene Google Drive.'
   );

 }

}
