html{
  background:#02060c;
}

body{
  position:relative;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 18% 10%, rgba(124,58,237,.20), transparent 28%),
    radial-gradient(circle at 82% 16%, rgba(14,165,233,.16), transparent 24%),
    radial-gradient(circle at 50% 95%, rgba(249,115,22,.08), transparent 34%),
    linear-gradient(180deg,#040914 0%,#07111f 40%,#030812 100%);
  background-attachment:fixed;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  opacity:.22;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 44px,
      rgba(255,255,255,.025) 45px,
      transparent 46px 90px
    );
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.50) 100%);
}

.app{
  max-width:1280px;
  padding:18px 18px 110px;
}

header{
  position:sticky;
  top:0;
  z-index:40;
  margin:-18px -18px 0;

.brand{
  letter-spacing:-1.2px;
  text-shadow:0 8px 30px rgba(167,139,250,.18);
}

.hero{
  position:relative;

  min-height:270px;
  display:flex;

  justify-content:flex-end;
  padding:30px;

    0 30px 80px rgba(0,0,0,.38),

.hero::before{
  content:"";

  width:250px;
  height:250px;

.hero::after{

  position:absolute;
  right:42px;

  line-height:1;

.card{

.poster{

nav{

nav button:active{

dialog{

<div class="app">

<section class="hero">

<script>
let tokenClient,accessToken=null,items=[],movies=[],filter='Todos',onlyFav=false,deferredPrompt=null,currentDrive=null,navigation=[],renderLimit=60;
let enrichRunning=false,enrichGeneration=0;
let authBusy=false;
const fav=new Set(JSON.parse(localStorage.getItem('ck_fav')||'[]'));
const metaCache=new Map(JSON.parse(localStorage.getItem('ck_meta_cache')||'[]'));
const notice=document.getElementById('notice'),grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),sectionTitle=document.getElementById('sectionTitle'),breadcrumb=document.getElementById('breadcrumb'),pathName=document.getElementById('pathName');
function msg(t){notice.style.display='block';notice.textContent=t}
function saveMetaCache(){try{localStorage.setItem('ck_meta_cache',JSON.stringify([...metaCache.entries()].slice(-500)))}catch{}}



function initGoogle(){
  if(!window.google?.accounts?.oauth2){
    setTimeout(initGoogle,400);
    return;
  }

  const id=window.CINEKIDS?.GOOGLE_CLIENT_ID||'';

  if(!id||id.includes('PON_AQUI')){
    return;
  }

  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:id,
    scope:'https://www.googleapis.com/auth/drive.readonly',

    callback:async r=>{
      if(r.error){
        msg('Error de autenticación: '+r.error);
        return;
      }

      accessToken=r.access_token;

      document.getElementById('loginBtn').textContent='Google conectado';

      msg('Cuenta conectada. Buscando unidades compartidas…');

      await loadSharedDrives();
    }
  });
}

addEventListener('load',()=>setTimeout(initGoogle,600));

function googleLogin(){
  const id=window.CINEKIDS?.GOOGLE_CLIENT_ID||'';

  if(!id||id.includes('PON_AQUI')){
    msg('Falta conectar Google OAuth. Revisa config.js.');
    return;
  }

  if(!tokenClient){
    initGoogle();
  }

  if(tokenClient){
    tokenClient.requestAccessToken({
      prompt:'consent'
    });
  }else{
    msg('Google todavía está cargando. Intenta nuevamente en unos segundos.');
  }
}



async function api(path){const response=await fetch('https://www.googleapis.com/drive/v3/'+path,{headers:{Authorization:'Bearer '+accessToken}});if(!response.ok)throw new Error(await response.text());return response.json()}
async function loadSharedDrives(){if(!accessToken)return;try{const allDrives=[];let pageToken='';do{let path='drives?pageSize=100';if(pageToken)path+='&pageToken='+encodeURIComponent(pageToken);const data=await api(path);allDrives.push(...(data.drives||[]));pageToken=data.nextPageToken||''}while(pageToken);const chooser=document.getElementById('driveChooser');chooser.innerHTML='';allDrives.forEach(d=>{const button=document.createElement('button');button.className='btn secondary';button.textContent=d.name;button.onclick=()=>openDrive(d);chooser.appendChild(button)});msg(`Encontradas ${allDrives.length} unidades compartidas. Elige una para explorarla.`)}catch(e){msg('No se pudieron leer las unidades compartidas: '+e.message)}}
async function openDrive(drive){currentDrive=drive;navigation=[{id:drive.id,name:drive.name,root:true}];document.getElementById('driveChooser').innerHTML='';breadcrumb.style.display='flex';await loadFolder(drive.id,drive.name,true)}
async function loadFolder(folderId,folderName,isRoot=false){if(!currentDrive)return;msg('Abriendo '+folderName+'…');pathName.textContent=navigation.map(x=>x.name).join(' › ');sectionTitle.textContent=folderName;try{const result=[];let pageToken='';do{const query=`'${folderId}' in parents and trashed = false`;const q=encodeURIComponent(query);const fields=encodeURIComponent('nextPageToken,files(id,name,mimeType,size,modifiedTime,parents,thumbnailLink,webViewLink,description)');let path=`files?corpora=drive&driveId=${encodeURIComponent(currentDrive.id)}&includeItemsFromAllDrives=true&supportsAllDrives=true&pageSize=1000&q=${q}&fields=${fields}&orderBy=folder,name`;if(pageToken)path+='&pageToken='+encodeURIComponent(pageToken);const data=await api(path);result.push(...(data.files||[]));pageToken=data.nextPageToken||''}while(pageToken);items=result;movies=result.filter(f=>looksLikeMovie(f.name,f.mimeType)).map(f=>({...f,cat:detectCategory(f.name)}));renderLimit=60;render();const folders=result.filter(isFolder).length;msg(`${folderName}: ${folders} carpetas · ${movies.length} películas.`)}catch(e){msg('Error al abrir la carpeta: '+e.message)}}
function isFolder(f){return f.mimeType==='application/vnd.google-apps.folder'}
async function openFolder(id,encodedName){const name=decodeURIComponent(encodedName);navigation.push({id,name,root:false});await loadFolder(id,name,false)}
async function goBack(){if(navigation.length<=1){navigation=[];currentDrive=null;items=[];movies=[];breadcrumb.style.display='none';pathName.textContent='';sectionTitle.textContent='Tu biblioteca';renderLimit=60;render();await loadSharedDrives();return}navigation.pop();const previous=navigation[navigation.length-1];await loadFolder(previous.id,previous.name,previous.root)}
function looksLikeMovie(name,mime){if(mime==='application/vnd.google-apps.folder')return false;return (mime||'').startsWith('video/')||/\.(mp4|mkv|avi|mov|m4v|webm|mpeg|mpg)$/i.test(name||'')}

function cleanTitle(name){
  return String(name||'')
    .replace(/\.(mp4|mkv|avi|mov|m4v|webm|mpeg|mpg)$/i,'')
    .replace(/\[[^\]]+\]/g,' ')
    .replace(/\((?:1080p|720p|2160p|4k|bluray|web[- ]?dl|webrip|hdrip|dvdrip)[^)]*\)/ig,' ')
    .replace(/\b(1080p|720p|2160p|4k|bluray|web[- ]?dl|webrip|hdrip|dvdrip|x264|x265|h264|h265|hevc|aac|latino|dual|castellano|español|sub(?:s|titulado)?|multi)\b/ig,' ')
    .replace(/[._\-]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function normalizeTitle(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/\b(19\d{2}|20\d{2})\b/g,' ')
    .replace(/[^a-z0-9]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function titleScore(a,b){
  const A=normalizeTitle(a), B=normalizeTitle(b);
  if(!A||!B)return 0;
  if(A===B)return 100;
  if(A.includes(B)||B.includes(A))return 88;

  const sa=new Set(A.split(' ').filter(x=>x.length>1));
  const sb=new Set(B.split(' ').filter(x=>x.length>1));
  const inter=[...sa].filter(x=>sb.has(x)).length;
  const union=new Set([...sa,...sb]).size||1;
  return Math.round((inter/union)*80);
}

function detectYear(name){const m=String(name||'').match(/(19\d{2}|20\d{2})/);return m?m[1]:''}
function detectCategory(name){const n=String(name||'').toLowerCase();if(n.includes('animacion')||n.includes('animación')||n.includes('cartoon')||n.includes('disney')||n.includes('pixar'))return 'Animación';return 'Familiar'}
function basicMetadata(movie){return{title:cleanTitle(movie.name),originalTitle:'',overview:movie.description||'Sin descripción disponible.',poster:drivePreviewImage(movie),year:detectYear(movie.name),rating:'',language:''}}

async function translateToSpanish(text){
  const value=String(text||'').trim();
  if(!value)return '';
  try{
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q='+encodeURIComponent(value);
    const r=await fetch(url);
    if(!r.ok)return value;
    const d=await r.json();
    const translated=(d?.[0]||[]).map(x=>x?.[0]||'').join('').trim();
    return translated||value;
  }catch{
    return value;
  }
}


function drivePreviewImage(movie){
  if(movie?.thumbnailLink){
    return String(movie.thumbnailLink)
      .replace(/=s\d+(-c)?$/,'=s700')
      .replace(/=w\d+-h\d+(-p-k-nu)?$/,'=w700');
  }
  return '';
}

async function autoTranslateToSpanish(text){
  const value=String(text||'').trim();
  if(!value)return '';
  try{
    const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q='+encodeURIComponent(value);
    const r=await fetch(u);
    if(!r.ok)return value;
    const d=await r.json();
    return (d?.[0]||[]).map(x=>x?.[0]||'').join('').trim()||value;
  }catch{
    return value;
  }
}

async function spanishOverviewFor(tmdbId,key,fallback=''){
  try{
    const r=await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${encodeURIComponent(key)}&language=es-MX`);
    if(r.ok){
      const d=await r.json();
      if(d.overview?.trim())return d.overview.trim();
    }

    const tr=await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}/translations?api_key=${encodeURIComponent(key)}`);
    if(tr.ok){
      const td=await tr.json();
      const list=td.translations||[];
      const preferred =
        list.find(x=>x.iso_639_1==='es' && x.iso_3166_1==='MX') ||
        list.find(x=>x.iso_639_1==='es' && x.iso_3166_1==='ES') ||
        list.find(x=>x.iso_639_1==='es');
      const txt=preferred?.data?.overview?.trim();
      if(txt)return txt;
    }
  }catch{}

  return fallback ? await autoTranslateToSpanish(fallback) : '';
}

async function getMovieMetadata(movie){
  if(metaCache.has(movie.id))return metaCache.get(movie.id);

  const key=window.CINEKIDS?.TMDB_API_KEY||'';
  if(!key)return basicMetadata(movie);

  const rawTitle=cleanTitle(movie.name);
  const query=rawTitle.replace(/\b(19\d{2}|20\d{2})\b/g,'').trim();
  const year=detectYear(movie.name);

  try{
    const params=new URLSearchParams({
      api_key:key,
      language:'es-MX',
      region:'MX',
      query,
      include_adult:'false'
    });
    if(year)params.set('year',year);

    const r=await fetch('https://api.themoviedb.org/3/search/movie?'+params.toString());
    if(!r.ok)throw new Error('TMDB '+r.status);
    const data=await r.json();

    const candidates=(data.results||[]).slice(0,10).map(hit=>{
      let score=Math.max(
        titleScore(rawTitle, hit.title),
        titleScore(rawTitle, hit.original_title)
      );

      const hitYear=(hit.release_date||'').slice(0,4);

      if(year && hitYear){
        if(year===hitYear)score+=18;
        else if(Math.abs(Number(year)-Number(hitYear))===1)score+=6;
        else score-=20;
      }

      if(hit.poster_path)score+=2;

      return {hit,score};
    }).sort((a,b)=>b.score-a.score);

    const best=candidates[0];

    if(!best || best.score<72){
      const meta=basicMetadata(movie);
      meta.poster=drivePreviewImage(movie);
      meta.match='drive-preview';
      metaCache.set(movie.id,meta);
      saveMetaCache();
      return meta;
    }

    const hit=best.hit;
    let overview=hit.overview||'';

    if(!overview || /\b(the|and|with|from|into|after|when|while|his|her|their|must|young|story)\b/i.test(overview)){
      overview=await spanishOverviewFor(hit.id,key,overview||movie.description||'');
    }

    const meta={
      title:hit.title||rawTitle,
      originalTitle:hit.original_title||'',
      overview:overview||'Sin descripción disponible.',
      poster:hit.poster_path?'https://image.tmdb.org/t/p/w500'+hit.poster_path:drivePreviewImage(movie),
      year:(hit.release_date||'').slice(0,4)||year,
      rating:hit.vote_average?Number(hit.vote_average).toFixed(1):'',
      language:hit.original_language||'',
      match:'tmdb',
      score:best.score
    };

    metaCache.set(movie.id,meta);
    saveMetaCache();
    return meta;

  }catch{
    const meta=basicMetadata(movie);
    meta.poster=drivePreviewImage(movie);
    return meta;
  }
}

async function enrichVisibleMovies(){
  if(enrichRunning)return;
  const key=window.CINEKIDS?.TMDB_API_KEY||'';
  if(!key)return;

  const generation=++enrichGeneration;
  enrichRunning=true;

  try{
    const q=search.value.toLowerCase().trim();
    let list=movies.filter(m=>
      (filter==='Todos'||m.cat===filter) &&
      (!onlyFav||fav.has(m.id)) &&
      cleanTitle(m.name).toLowerCase().includes(q)
    ).slice(0,renderLimit);

    const pending=list.filter(m=>!metaCache.has(m.id));

    if(!pending.length)return;

    msg(`Buscando portadas y fichas en español… 0/${pending.length}`);

    let done=0;
    const workers=4;

    async function worker(){
      while(pending.length && generation===enrichGeneration){
        const m=pending.shift();
        if(!m)break;
        try{ await getMovieMetadata(m); }catch{}
        done++;
        if(done===1 || done%4===0 || done===done+pending.length){
          msg(`Buscando portadas y fichas en español… ${done}/${done+pending.length}`);
          render(false);
        }
      }
    }

    await Promise.all(Array.from({length:workers},worker));

    if(generation===enrichGeneration){
      render(false);
      msg('Portadas y fichas visibles actualizadas.');
    }
  }finally{
    enrichRunning=false;
  }
}

function resetRender(){renderLimit=60;render()}
function render(triggerEnrich=true){const q=search.value.toLowerCase().trim();let folders=items.filter(isFolder).filter(f=>String(f.name||'').toLowerCase().includes(q));let movieList=movies.filter(m=>(filter==='Todos'||m.cat===filter)&&(!onlyFav||fav.has(m.id))&&cleanTitle(m.name).toLowerCase().includes(q));if(onlyFav)folders=[];count.textContent=`${folders.length} carpetas · ${movieList.length} películas`;const visibleMovies=movieList.slice(0,renderLimit);let html='';html+=folders.map(f=>{const encodedName=encodeURIComponent(f.name);return `<article class="card" onclick="openFolder('${f.id}','${encodedName}')"><div class="poster folderPoster"><div><span class="folderIcon">📁</span>${escapeHtml(f.name)}</div></div><div class="meta"><div class="title">${escapeHtml(f.name)}</div><div class="small">Carpeta</div></div></article>`}).join('');html+=visibleMovies.map(m=>{const cached=metaCache.get(m.id);const poster=cached?.poster||'';const shownTitle=cached?.title||cleanTitle(m.name);const year=cached?.year||detectYear(m.name);return `<article class="card" onclick="openMovie('${m.id}')"><button class="heart" onclick="event.stopPropagation();toggleFav('${m.id}')">${fav.has(m.id)?'♥':'♡'}</button><div class="poster">${poster?`<img loading="lazy" src="${escapeHtml(poster)}" alt="">`:''}${poster?'':`<div><span class="movieIcon">🎬</span>${escapeHtml(shownTitle)}</div>`}${poster?`<div class="posterShade">${escapeHtml(shownTitle)}</div>`:''}</div><div class="meta"><div class="title">${escapeHtml(shownTitle)}</div><div class="small">${year?escapeHtml(year)+' · ':''}${escapeHtml(m.mimeType||'video')}</div></div></article>`}).join('');if(movieList.length>renderLimit)html+=`<div class="loadMore"><button class="btn secondary" onclick="loadMore()">Cargar más (${movieList.length-renderLimit})</button></div>`;if(!html)html=`<div class="empty">${accessToken?'Esta carpeta está vacía o no contiene videos compatibles.':'Conecta Google para cargar tu catálogo.'}</div>`;grid.innerHTML=html;if(triggerEnrich)setTimeout(enrichVisibleMovies,80)}
function loadMore(){renderLimit+=60;render()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('ck_fav',JSON.stringify([...fav]));render()}
function setFilter(value,button){filter=value;onlyFav=false;renderLimit=60;sectionTitle.textContent=value==='Todos'?(navigation.length?navigation[navigation.length-1].name:'Tu biblioteca'):value;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(button&&button.closest?.('.tabs'))button.classList.add('active');render()}
function showFavorites(){onlyFav=true;filter='Todos';renderLimit=60;sectionTitle.textContent='Favoritos';render()}
async function home(){filter='Todos';onlyFav=false;navigation=[];currentDrive=null;items=[];movies=[];renderLimit=60;breadcrumb.style.display='none';sectionTitle.textContent='Tu biblioteca';render();if(accessToken)await loadSharedDrives();scrollTo({top:0,behavior:'smooth'})}
function focusSearch(){
  search.focus();
  search.scrollIntoView({behavior:'smooth',block:'center'});
}

function settings(){const tmdb=window.CINEKIDS?.TMDB_API_KEY?'Sí':'No';msg('Ajustes\nGoogle Client ID configurado: '+(window.CINEKIDS?.GOOGLE_CLIENT_ID&&!window.CINEKIDS.GOOGLE_CLIENT_ID.includes('PON_AQUI')?'Sí':'No')+'\nPortadas y fichas TMDB: '+tmdb)}
async function openMovie(id){const movie=movies.find(x=>x.id===id);if(!movie)return;const player=document.getElementById('player'),drivePlayer=document.getElementById('drivePlayer'),ptitle=document.getElementById('ptitle'),pmeta=document.getElementById('pmeta'),detailPoster=document.getElementById('detailPoster'),detailChips=document.getElementById('detailChips'),overview=document.getElementById('overview');const meta=await getMovieMetadata(movie);ptitle.textContent=meta.title||cleanTitle(movie.name);pmeta.textContent=movie.mimeType||'video';detailPoster.src=meta.poster||'';detailPoster.style.display=meta.poster?'block':'none';const chips=[];if(meta.year)chips.push(meta.year);if(meta.rating)chips.push('★ '+meta.rating);if(meta.language)chips.push('Idioma original: '+meta.language.toUpperCase());if(meta.match==='drive-preview')chips.push('Vista previa de Drive');detailChips.innerHTML=chips.map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join('');overview.textContent=meta.overview||'Sin descripción disponible.';drivePlayer.src='https://drive.google.com/file/d/'+encodeURIComponent(movie.id)+'/preview';player.showModal();metaCache.set(movie.id,meta);saveMetaCache();render();msg('Película abierta desde Google Drive.')}
function closePlayer(){document.getElementById('drivePlayer').src='about:blank';document.getElementById('player').close()}


function logout(){
  accessToken=null;
  authBusy=false;
  items=[];
  movies=[];
  navigation=[];
  currentDrive=null;
  renderLimit=60;

  document.getElementById('driveChooser').innerHTML='';
  document.getElementById('loginBtn').textContent='Continuar con Google';

  breadcrumb.style.display='none';
  sectionTitle.textContent='Tu biblioteca';

  render();

  msg('Sesión cerrada.');
}


addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event});
async function installApp(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else msg('En Chrome abre el menú ⋮ y elige “Instalar aplicación” o “Añadir a pantalla de inicio”.')}
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(registrations=>Promise.all(registrations.map(r=>r.unregister())))
    .catch(()=>{});
}
if('caches' in window){
  caches.keys()
    .then(keys=>Promise.all(keys.map(k=>caches.delete(k))))
    .catch(()=>{});
}
render();
